name: Angular Build and Deploy

on:
  push:
    branches:
      - deploy

# deploy to GitHub Pages directly (Pages source "GitHub Actions"), no gh-pages branch with committed builds
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, a running deployment is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Angular app to prod
        run: npm run build:prod

      - name: Upload build result
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/websph/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
