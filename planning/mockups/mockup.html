<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebSPH – new UI mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="m3.css" />
    <style>
      /* page background continues the ground, so scrolling below the canvas looks seamless */
      body {
        background: var(--sim-ground);
        min-height: 100vh;
      }
      #sim {
        position: absolute;
        inset: 0 0 auto 0;
        width: 100%;
        height: 100vh;
        display: block;
      }
      header {
        position: absolute;
        inset: 0 0 auto 0;
        height: 64px;
        display: flex;
        align-items: center;
        gap: var(--s);
        padding: 0 var(--m);
        z-index: 2;
      }
      header .brand {
        font-size: 22px;
        font-weight: 500;
        margin-right: var(--s);
      }
      header .spacer {
        flex: 1;
      }
      #dock {
        position: relative;
        z-index: 2;
        display: grid;
        justify-items: center;
        gap: var(--m);
        padding: var(--m);
      }
      .controls {
        display: flex;
        align-items: center;
        gap: var(--m);
      }
      .controls .time {
        line-height: 20px;
        min-width: 64px;
        font-size: 16px;
      }
      #panel {
        width: min(560px, 100%);
        background: color-mix(in srgb, var(--surface-container) 92%, transparent);
        border: 1px solid var(--outline-variant);
      }
      #desc {
        margin: 0;
        max-width: 480px;
        text-align: center;
        color: var(--on-surface-variant);
      }
      #desc[hidden],
      #panel[hidden] {
        display: none;
      }
      /* scenario sheet */
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--surface);
        overflow: auto;
        padding: var(--l) var(--m);
      }
      #sheet[hidden] {
        display: none;
      }
      #sheet .inner {
        max-width: 1100px;
        margin: 0 auto;
      }
      #sheet h1 {
        font-size: 32px;
        line-height: 40px;
        font-weight: 400;
        margin: var(--m) 0 var(--xs);
      }
      #sheet .sub {
        color: var(--on-surface-variant);
        margin: 0 0 var(--l);
      }
      #sheet .close {
        float: right;
      }
      @media (max-width: 600px) {
        header .brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="sim"></canvas>
    <header>
      <span class="brand">WebSPH</span>
      <button class="chip" id="scenarioChip">
        <span id="scenarioName"></span><span class="icon">expand_more</span>
      </button>
      <span class="spacer"></span>
      <button class="icon-btn" id="copy" title="Copy link"><span class="icon">link</span></button>
      <a class="icon-btn" href="#" title="Original thesis UI"><span class="icon">history_edu</span></a>
    </header>
    <div id="dock">
      <div class="controls">
        <button class="icon-btn" id="reset" title="Reset"><span class="icon">replay</span></button>
        <button class="fab" id="play" title="Play / pause"><span class="icon">play_arrow</span></button>
        <span class="time mono"><span id="time"></span><br /><span class="label mono" id="fps">– fps</span></span>
        <button class="icon-btn" id="tune" title="Settings"><span class="icon">tune</span></button>
      </div>
      <p id="desc"></p>
      <div id="panel" class="surface" hidden></div>
    </div>
    <div id="sheet" hidden>
      <div class="inner">
        <button class="icon-btn close" id="closeSheet"><span class="icon">close</span></button>
        <h1>1D shallow water, simulated with particles</h1>
        <p class="sub">Pick a scenario and press play.</p>
        <div id="cards"></div>
      </div>
    </div>

    <script src="sph.js"></script>
    <script src="core.js"></script>
    <script src="ui.js"></script>
    <script>
      const canvas = document.getElementById('sim');
      const dock = document.getElementById('dock');
      const ctl = new SimController(canvas, (c, config) => {
        const rect = domainRect(c, config, { top: 64, bottomSpace: 120 });
        dock.style.marginTop = rect.top + rect.height + 'px';
        return rect;
      });
      const openBuilder = UI.builder(ctl);
      const sheet = document.getElementById('sheet');
      const name = () => {
        const c = ctl.config;
        document.getElementById('scenarioName').textContent = PRESETS[c.scenario]?.title || 'Custom';
        document.getElementById('desc').textContent =
          PRESETS[c.scenario]?.text ||
          `${c.particles} particles, ${DISTRIBUTION_LABELS[c.distribution].toLowerCase()}, ${GROUND_LABELS[c.ground].toLowerCase()} ground, ${c.boundary} boundary.`;
      };
      ctl.on((t) => {
        if (t === 'load') {
          name();
          sheet.hidden = true;
        }
      });
      name();
      UI.cards(document.getElementById('cards'), (id) => UI.pick(ctl, id, openBuilder), ctl);
      UI.settings(document.getElementById('panel'), ctl);
      UI.bindPlay(document.getElementById('play'), document.getElementById('time'), ctl);
      document.getElementById('reset').onclick = () => ctl.reset();
      document.getElementById('copy').onclick = () => UI.copyLink(ctl);
      document.getElementById('scenarioChip').onclick = () => (sheet.hidden = false);
      document.getElementById('closeSheet').onclick = () => (sheet.hidden = true);
      const tune = document.getElementById('tune');
      tune.onclick = () => {
        const p = document.getElementById('panel');
        p.hidden = !p.hidden;
        document.getElementById('desc').hidden = !p.hidden;
        tune.classList.toggle('on', !p.hidden);
      };
      // landing: scenario sheet open unless the URL selects one
      sheet.hidden = configFromUrl().selected;
      UI.ignoredNotice();
      const fps = document.getElementById('fps');
      ctl.on((t) => (fps.textContent = ctl.running ? Math.round(ctl.fps) + ' fps' : '– fps'));
    </script>
  </body>
</html>
